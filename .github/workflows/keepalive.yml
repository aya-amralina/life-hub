# Keep-alive: free Supabase pauses a project after 7 days without activity (e.g. Kazakhstan, 21.12–08.01).
# Once a day this calls public.ping() (select 1, allowed to the publishable key) — a real request to the
# database. Fails when the answer is not 1, so a red run shows that the base was not reached.
# Secrets (Settings → Secrets and variables → Actions): SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
name: keep-alive

on:
  schedule:
    - cron: '17 6 * * *' # every day 06:17 UTC
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping() → 1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -eu
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Secrets SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY are not set"; exit 1
          fi
          answer=$(curl -fsS --retry 3 --retry-delay 20 -X POST "${SUPABASE_URL%/}/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "ping → $answer"
          test "$answer" = "1"
