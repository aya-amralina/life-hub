<h2>Вход в Life Hub</h2>
<p>Код для входа: <strong style="font-size:24px;letter-spacing:2px">{{ .Token }}</strong></p>
<p>Введи его в приложении на телефоне — или открой ссылку в браузере:</p>
<p><a href="{{ .ConfirmationURL }}">Войти в Life Hub</a></p>
<p style="color:#706A5F">Код и ссылка действуют 1 час. Если ты не запрашивала вход — просто удали письмо.</p>
